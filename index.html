<body>
<canvas id="c" aria-label="Modelo anatômico 3D"></canvas>
<header class="top">
  <div class="marca"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 9.5a8.5 8.5 0 0 1 17 0" stroke="var(--ac)" stroke-width="1.6" stroke-linecap="round" opacity=".6"/><path d="M12 2.5v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 14.2l-3.1 4a3.9 3.9 0 0 0 6.2 0z" fill="var(--ac)"/></svg><span>cinesio<i>mecânica</i></span></div>
  <nav class="reg" id="regioes" aria-label="Seções">
    <button class="chip" data-r="corpo">Atlas</button>
    <button class="chip" data-r="ombro">Ombro</button>
    <button class="chip" data-r="cotovelo">Cotovelo</button>
    <button class="chip" data-r="joelho">Joelho</button>
    <button class="chip" data-r="movimento">Movimento</button>
    <button class="chip" data-r="postura">Postura</button>
  </nav>
  <div class="busca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar osso ou músculo" autocomplete="off"><div class="sug" id="sug"></div></div>
</header>
<div class="chips" id="camadas">
  <button class="chip on" data-c="ossos" style="--k:var(--osso)"><i></i>Ossos</button>
  <button class="chip on" data-c="musculos" style="--k:var(--mus)"><i></i>Músculos</button>
  <button class="chip" data-c="insercoes" style="--k:linear-gradient(90deg,var(--ori) 50%,var(--ins) 50%)"><i></i>Origem e inserção</button>
  <button class="chip" data-c="articulacoes" style="--k:#d9c27a"><i></i>Ligamentos</button>
</div>
<div class="ferr" id="ferr">
  <button class="chip" id="bTirar" title="Toque nas estruturas para tirá-las e ver o que está embaixo">✂︎ Tirar</button>
  <button class="chip" id="bVoltar" disabled>↶ Voltar</button>
  <button class="chip" id="bPadrao">⟲ Padrão</button>
  <button class="chip" id="bLado">Só direito</button>
</div>
<div class="ferr movbar" id="movbar"><button class="chip" id="bDados">☰ Dados</button><button class="chip on" id="bSairMov">✕ Sair do modo movimento</button></div>
<div class="dica" id="dica">Toque em uma estrutura · arraste para girar · pinça para zoom</div>
<div class="toast" id="toast"></div>
<div id="rot"></div>
<div class="cred">Modelos: Z-Anatomy (CC BY-SA 4.0), a partir do BodyParts3D</div>
<aside class="painel" id="painel" aria-live="polite"><div class="p-h"><div><h2 id="pT"></h2><div class="sub" id="pS"></div></div><button class="x" id="pX" aria-label="Fechar">×</button></div><div class="p-b" id="pB"></div></aside>
<div class="carga" id="carga"><div><b>cinesio<span style="color:var(--ac)">mecânica</span></b><span id="cTxt">Carregando o esqueleto…</span><div class="barra"><i id="cBar"></i></div></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
